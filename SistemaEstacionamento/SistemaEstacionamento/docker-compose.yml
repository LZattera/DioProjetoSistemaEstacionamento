version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_estacionamento
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_estacionamento
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus